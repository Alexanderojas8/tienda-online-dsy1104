<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Tienda Online</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Tienda Online</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blog.html">Blog</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Contacto</h2>

            <p>
                Envíanos tu consulta y te responderemos lo antes posible.
            </p>

            <form id="form-contacto">

                <div class="campo-formulario">
                    <label for="contacto-nombre">Nombre:</label>

                    <input
                        type="text"
                        id="contacto-nombre"
                        name="nombre"
                    >

                    <small
                        class="error"
                        id="error-contacto-nombre">
                    </small>
                </div>


                <div class="campo-formulario">
                    <label for="contacto-correo">Correo:</label>

                    <input
                        type="email"
                        id="contacto-correo"
                        name="correo"
                    >

                    <small
                        class="error"
                        id="error-contacto-correo">
                    </small>
                </div>


                <div class="campo-formulario">
                    <label for="contacto-comentario">
                        Comentario:
                    </label>

                    <textarea
                        id="contacto-comentario"
                        name="comentario">
                    </textarea>

                    <small
                        class="error"
                        id="error-contacto-comentario">
                    </small>
                </div>


                <button type="submit">
                    Enviar mensaje
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>© 2026 Tienda Online DSY1104</p>
    </footer>

    <script src="js/validaciones.js"></script>

</body>

</html>
