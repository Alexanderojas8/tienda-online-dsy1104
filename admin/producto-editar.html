<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Producto - Administración</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/styles.css">

    <style>
        body {
            background: #f4f7fb;
            color: #07132f;
        }

        .admin-navbar {
            background: #071226;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, #00d9ff, #7b45ff, #ff35e8) 1;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.18);
        }

        .admin-navbar .navbar-brand {
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(90deg, #16dfff, #6f62ff, #d542ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-navbar .nav-link {
            color: white !important;
            margin: 0 4px;
            padding: 10px 13px !important;
            border-radius: 8px;
            font-weight: 500;
        }

        .admin-navbar .nav-link:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .admin-navbar .nav-link.active {
            background: linear-gradient(135deg, #633cff, #246dff);
            box-shadow:
                0 0 0 2px rgba(43, 218, 255, 0.35),
                0 0 18px rgba(103, 70, 255, 0.75);
        }

        .admin-hero {
            margin-top: 38px;
            padding: 28px 22px;
            border-radius: 8px;
            background:
                radial-gradient(circle at 95% 0%, rgba(116, 66, 255, 0.25), transparent 35%),
                linear-gradient(115deg, #08263a, #0b1730 48%, #1f215a);
            color: white;
            box-shadow: 0 18px 45px rgba(16, 40, 80, 0.18);
        }

        .admin-badge {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid #00d6ff;
            color: #11dfff;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .admin-hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #ffffff !important;
        }

        .admin-hero p {
            color: #ffffff !important;
        }

        .form-card {
            max-width: 720px;
            margin: 20px auto 60px;
            background: white;
            padding: 28px 20px;
            border-radius: 8px;
            border-top: 3px solid transparent;
            border-image: linear-gradient(90deg, #00d9ff, #764cff, #ef35e9) 1;
            box-shadow: 0 14px 35px rgba(17, 39, 82, 0.10);
        }

        .form-card h2 {
            font-size: 1.75rem;
            font-weight: 800;
        }

        .campo-formulario {
            margin-top: 19px;
        }

        .campo-formulario label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .campo-formulario input,
        .campo-formulario textarea,
        .campo-formulario select {
            width: 100%;
            border: 1px solid #ccd6e5;
            border-radius: 7px;
            padding: 11px 12px;
            background: white;
        }

        .campo-formulario textarea {
            min-height: 100px;
            resize: vertical;
        }

        .campo-formulario input:focus,
        .campo-formulario textarea:focus,
        .campo-formulario select:focus {
            outline: none;
            border-color: #5c73ff;
            box-shadow: 0 0 0 3px rgba(91, 105, 255, 0.12);
        }

        .botones-formulario {
            margin-top: 26px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-guardar {
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            background: linear-gradient(135deg, #5738f7, #176cff);
        }

        .btn-cancelar {
            padding: 11px 22px;
            border-radius: 8px;
            color: #172039;
            background: #e8edf5;
            text-decoration: none;
            font-weight: 700;
        }

        .btn-cancelar:hover {
            background: #dbe3ee;
        }

        @media (max-width: 768px) {
            .admin-hero h1 {
                font-size: 2rem;
            }

            .form-card {
                margin-left: 12px;
                margin-right: 12px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark admin-navbar">
    <div class="container">

        <a class="navbar-brand" href="../index.html">
            Tienda Online
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#adminNavbar"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">

            <ul class="navbar-nav ms-3">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio Admin
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="productos.html">
                        Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="usuarios.html">
                        Usuarios
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="../index.html">
                        Volver a la tienda
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>


<main class="container">

    <section class="admin-hero">

        <div class="admin-badge">
            ⚡ ADMINISTRACIÓN
        </div>

        <h1>Editar producto</h1>

        <p class="mb-0">
            Modifica los datos del producto seleccionado.
        </p>

    </section>


    <section class="form-card">

        <h2>Editar producto</h2>

        <p class="text-secondary">
            Modifica los datos del producto seleccionado.
        </p>


        <form id="form-editar-producto">

            <div class="campo-formulario">
                <label for="editar-codigo">Código</label>
                <input
                    type="text"
                    id="editar-codigo"
                    placeholder="Ej: PROD001"
                >
            </div>


            <div class="campo-formulario">
                <label for="editar-nombre">Nombre</label>
                <input
                    type="text"
                    id="editar-nombre"
                    placeholder="Nombre del producto"
                >
            </div>


            <div class="campo-formulario">
                <label for="editar-descripcion">Descripción</label>

                <textarea
                    id="editar-descripcion"
                    placeholder="Describe las características del producto"
                ></textarea>

            </div>


            <div class="campo-formulario">
                <label for="editar-precio">Precio</label>

                <input
                    type="number"
                    id="editar-precio"
                    min="0"
                >

            </div>


            <div class="campo-formulario">
                <label for="editar-stock">Stock</label>

                <input
                    type="number"
                    id="editar-stock"
                    min="0"
                >

            </div>


            <div class="campo-formulario">
                <label for="editar-stock-critico">
                    Stock crítico
                </label>

                <input
                    type="number"
                    id="editar-stock-critico"
                    min="0"
                >

            </div>


            <div class="campo-formulario">

                <label for="editar-categoria">
                    Categoría
                </label>

                <select id="editar-categoria">

                    <option value="">
                        Seleccione una categoría
                    </option>

                    <option value="Perifericos">
                        Periféricos
                    </option>

                    <option value="Audio">
                        Audio
                    </option>

                    <option value="Monitores">
                        Monitores
                    </option>

                    <option value="Accesorios">
                        Accesorios
                    </option>

                </select>

            </div>


            <div class="campo-formulario">

                <label for="editar-imagen">
                    URL de imagen
                </label>

                <input
                    type="text"
                    id="editar-imagen"
                    placeholder="https://ejemplo.com/producto.jpg"
                >

            </div>


            <div class="botones-formulario">

                <button
                    type="submit"
                    class="btn-guardar"
                >
                    Guardar cambios
                </button>

                <a
                    href="productos.html"
                    class="btn-cancelar"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </section>

</main>


<footer class="text-center py-4">

    <p class="mb-0">
        © 2026 Tienda Online DSY1104
    </p>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="../js/admin-productos.js"></script>

</body>
</html>
