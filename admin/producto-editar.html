<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Producto - Administración</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <h1>Administración</h1>

        <nav>
            <a href="index.html">Inicio Admin</a>
            <a href="productos.html">Productos</a>
            <a href="../index.html">Volver a la tienda</a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Editar producto</h2>

            <p>Modifica los datos del producto seleccionado.</p>

            <form id="form-editar-producto">

                <div class="campo-formulario">
                    <label for="editar-codigo">Código:</label>
                    <input type="text" id="editar-codigo">
                </div>

                <div class="campo-formulario">
                    <label for="editar-nombre">Nombre:</label>
                    <input type="text" id="editar-nombre">
                </div>

                <div class="campo-formulario">
                    <label for="editar-descripcion">Descripción:</label>
                    <textarea id="editar-descripcion"></textarea>
                </div>

                <div class="campo-formulario">
                    <label for="editar-precio">Precio:</label>
                    <input type="number" id="editar-precio">
                </div>

                <div class="campo-formulario">
                    <label for="editar-stock">Stock:</label>
                    <input type="number" id="editar-stock">
                </div>

                <div class="campo-formulario">
                    <label for="editar-stock-critico">Stock crítico:</label>
                    <input type="number" id="editar-stock-critico">
                </div>

                <div class="campo-formulario">

                    <label for="editar-categoria">Categoría:</label>

                    <select id="editar-categoria">

                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="Perifericos">
                            Periféricos
                        </option>

                        <option value="Audio">
                            Audio
                        </option>

                        <option value="Monitores">
                            Monitores
                        </option>

                    </select>

                </div>

                <div class="campo-formulario">
                    <label for="editar-imagen">URL de imagen:</label>
                    <input type="text" id="editar-imagen">
                </div>

                <div class="botones-formulario">

                    <button type="submit">
                        Guardar cambios
                    </button>

                    <a href="productos.html">
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Tienda Online DSY1104</p>
    </footer>

    <script src="../js/admin-productos.js"></script>

</body>

</html>
