<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Tienda Online</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">

    <style>

        body.login-page {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(59, 130, 246, 0.10),
                    transparent 35%
                ),
                #f4f6fb;
        }


        /* LOGO COMPLETO NEÓN */

        .login-page .logo-tienda-neon {
            display: inline-block;

            font-size: 1.7rem;
            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #22d3ee,
                    #3b82f6,
                    #8b5cf6,
                    #d946ef
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
            color: transparent;

            text-shadow: none;
        }


        /* CONTENEDOR LOGIN */

        .login-contenedor {
            min-height: calc(100vh - 150px);

            display: flex;
            align-items: center;

            padding-top: 45px;
            padding-bottom: 45px;
        }


        .login-card {
            position: relative;
            overflow: hidden;

            border:
                1px solid rgba(59, 130, 246, 0.18);

            border-radius: 20px;

            background: white;

            box-shadow:
                0 15px 35px rgba(15, 23, 42, 0.12);
        }


        .login-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #22d3ee,
                    #3b82f6,
                    #8b5cf6,
                    #d946ef
                );

            box-shadow:
                0 0 10px rgba(34, 211, 238, 0.55);
        }


        .login-icono {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 30px;

            box-shadow:
                0 0 10px rgba(34, 211, 238, 0.35),
                0 8px 20px rgba(37, 99, 235, 0.22);
        }


        .login-titulo {
            color: #0f172a;

            font-weight: 800;
        }


        .login-page .form-control {
            min-height: 48px;

            border-radius: 10px;

            border:
                1px solid #cbd5e1;
        }


        .login-page .form-control:focus {
            border-color:
                #22d3ee;

            box-shadow:
                0 0 0 3px rgba(34, 211, 238, 0.12),
                0 0 12px rgba(34, 211, 238, 0.18);
        }


        .btn-login {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-weight: 700;

            min-height: 48px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .btn-login:hover {
            color: white;

            transform:
                translateY(-2px);

            box-shadow:
                0 0 8px rgba(34, 211, 238, 0.45),
                0 0 18px rgba(124, 58, 237, 0.25);
        }


        .login-enlace {
            color: #2563eb;

            font-weight: 600;

            text-decoration: none;
        }


        .login-enlace:hover {
            color: #7c3aed;
        }


        .error-login {
            display: block;

            margin-top: 5px;

            color: #dc2626;

            font-size: 0.85rem;
        }


        /* FOOTER */

        .login-footer {
            position: relative;

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #0f172a,
                    #111827
                ) !important;
        }


        .login-footer::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #22d3ee,
                    #3b82f6,
                    #a855f7,
                    #d946ef
                );

            box-shadow:
                0 0 10px rgba(34, 211, 238, 0.55);
        }

    </style>

</head>


<body class="login-page">


    <!-- =====================================
         NAVBAR NEÓN
    ====================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark navbar-neon">

        <div class="container">


            <!-- LOGO -->
            <a
                class="navbar-brand fw-bold"
                href="index.html">

                <span class="logo-tienda-neon">
                    Tienda Online
                </span>

            </a>


            <!-- BOTÓN MÓVIL -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPrincipal"
                aria-controls="navbarPrincipal"
                aria-expanded="false"
                aria-label="Abrir navegación">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- MENÚ -->
            <div
                class="collapse navbar-collapse"
                id="navbarPrincipal">


                <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="index.html">
                            Inicio
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="productos.html">
                            Productos
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="nosotros.html">
                            Nosotros
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="blog.html">
                            Blog
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="contacto.html">
                            Contacto
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="carrito.html">
                            Carrito
                        </a>
                    </li>

                </ul>


                <div class="d-flex align-items-center mt-3 mt-lg-0">

                    <a
                        href="registro.html"
                        class="btn carrito-navbar">

                        Crear cuenta

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- =====================================
         LOGIN
    ====================================== -->

    <main class="container login-contenedor">

        <div class="row justify-content-center w-100">

            <div class="col-12 col-md-9 col-lg-6 col-xl-5">


                <div class="card login-card">

                    <div class="card-body p-4 p-md-5">


                        <div class="login-icono">
                            👤
                        </div>


                        <h1 class="login-titulo text-center h2 mb-2">
                            Iniciar sesión
                        </h1>


                        <p class="text-muted text-center mb-4">
                            Ingresa a tu cuenta para continuar.
                        </p>



                        <!-- =====================================
                             FORMULARIO
                        ====================================== -->

                        <form id="form-login">


                            <!-- CORREO -->
                            <div class="mb-3">

                                <label
                                    for="login-correo"
                                    class="form-label fw-semibold">

                                    Correo electrónico

                                </label>


                                <input
                                    type="email"
                                    id="login-correo"
                                    name="correo"
                                    class="form-control"
                                    placeholder="ejemplo@gmail.com"
                                    autocomplete="email">


                                <small
                                    id="error-login-correo"
                                    class="error-login">
                                </small>

                            </div>



                            <!-- CONTRASEÑA -->
                            <div class="mb-4">

                                <label
                                    for="login-password"
                                    class="form-label fw-semibold">

                                    Contraseña

                                </label>


                                <input
                                    type="password"
                                    id="login-password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Ingresa tu contraseña"
                                    autocomplete="current-password">


                                <small
                                    id="error-login-password"
                                    class="error-login">
                                </small>

                            </div>



                            <!-- ERROR GENERAL -->
                            <div
                                id="error-login-general"
                                class="alert alert-danger d-none"
                                role="alert">
                            </div>



                            <!-- BOTÓN -->
                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-login btn-lg">

                                    Iniciar sesión

                                </button>

                            </div>

                        </form>



                        <hr class="my-4">


                        <p class="text-center mb-0">

                            ¿No tienes una cuenta?

                            <a
                                href="registro.html"
                                class="login-enlace">

                                Crear cuenta

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer
        class="login-footer text-white text-center py-4">

        <p class="mb-0">
            © 2026 Tienda Online DSY1104
        </p>

    </footer>



    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Usuarios -->
    <script src="js/usuarios.js"></script>


</body>

</html>
